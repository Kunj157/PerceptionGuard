name: CI Gate

on:
  pull_request:
    branches: [dev]
    paths:
      - "models/**"
      - "src/**"

jobs:
  eval-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evaluation and regression check
        id: gate
        run: python ci/run_gate.py --commit-sha ${{ github.sha }} --output gate_result.json
        continue-on-error: true

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const result = JSON.parse(fs.readFileSync('gate_result.json', 'utf8'));
              const icon = result.overall === 'pass' ? '✅' : result.overall === 'warning' ? '⚠️' : '❌';
              body = `## ${icon} PerceptionGuard Gate: ${result.overall.toUpperCase()}\n\n`;
              body += `| Scenario | mAP | Delta | Verdict |\n|----------|-----|-------|---------|\n`;
              for (const row of result.details) {
                body += `| ${row.weather}/${row.scene}/${row.time_of_day} | ${row.mean_ap.toFixed(3)} | ${row.delta_ap.toFixed(3)} | ${row.verdict} |\n`;
              }
              if (result.overall === 'critical') {
                body += `\n**Deployment blocked.** Critical accuracy drops detected.`;
              } else if (result.overall === 'warning') {
                body += `\n**Warning.** Accuracy drops detected but below critical threshold.`;
              } else {
                body += `\n**All clear.** No regressions detected.`;
              }
            } catch (e) {
              body = `## ❌ PerceptionGuard Gate: ERROR\n\nFailed to parse gate results. Check workflow logs.`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if critical
        if: steps.gate.outputs.overall == 'critical'
        run: exit 1
